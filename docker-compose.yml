services:
  postgres:
    image: postgres:15
    container_name: tp2-db
    environment:
      POSTGRES_USER: {DB_USER}
      POSTGRES_PASSWORD: {DB_PASSWORD}
      POSTGRES_DB: {DB_NAME}
    ports:
      - "{DB_PORT}:{DB_PORT}"
    volumes:
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql #entry point para inicializar la base de datos con el script schema.sql
      - pgdata:/var/lib/postgresql/data 

volumes:
  pgdata:
